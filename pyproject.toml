[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-utils"
version = "0.4.0"
description = "Reusable fMRI utilities for encoding, group analysis, registration QC, montages, transforms, and decoding."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "nibabel",
  "nilearn",
  "matplotlib>=3.8.0",
  "seaborn",
  "scikit-learn",
  "tqdm",
  "fire",
  "Pillow",
]

[project.scripts]
fmri-utils = "fmri_utils.second_level_analysis:main"
fmri-registration-qc = "fmri_utils.registration_qc:main"
fmri-registration-qc-manifest = "fmri_utils.registration_qc_manifest:main"
fmri-encoding = "fmri_utils.encoding.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
