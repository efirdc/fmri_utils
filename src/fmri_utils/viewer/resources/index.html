          // other cortex. The correction is how far the loop travels on the
          // geometry showing against how far it travels in the flat map --
          // but measured over a window of the path, not step by step. A
          // single step compares two edges whose lengths differ for reasons
          // that have nothing to do with the metric, and using that ratio
          // modulates the line by noise: measured here, step ratios spread
          // 0.5 to 1.65 around a median of 1.1, while the real distortion is
          // smooth.
          var pts = part.mesh.pts;
          var steps = loop.length;
          var flatSteps = new Float32Array(steps);
          var geomSteps = new Float32Array(steps);
          for (i = 0; i < steps; i += 1) {
            var here = loop[i] * 3;
            var next = loop[(i + 1) % steps] * 3;
            var fdx = flat[next + 2] - flat[here + 2];
            var fdy = flat[next + 1] - flat[here + 1];
            flatSteps[i] = Math.sqrt(fdx * fdx + fdy * fdy);
            var gdx = pts[next] - pts[here];
            var gdy = pts[next + 1] - pts[here + 1];
            var gdz = pts[next + 2] - pts[here + 2];
            geomSteps[i] = Math.sqrt(gdx * gdx + gdy * gdy + gdz * gdz);
          }
          var window = Math.max(6, Math.round(steps / 12));
          for (i = 0; i < steps; i += 1) {
            var flatRun = 0, geomRun = 0;
            for (var k = -window; k <= window; k += 1) {
              var at = (i + k + steps * 2) % steps;
              flatRun += flatSteps[at];
              geomRun += geomSteps[at];
            }
            var stretch = flatRun > 1e-4 ? geomRun / flatRun : 1;
            stretch = Math.min(Math.max(stretch, 0.5), 2);
            widths[i] = (state.outlineWidth / 2) * pixelsPerMM / stretch;
          }
          relaxPath(points, 4, 0.5);
          relaxWidths(widths, 12);
          fillBand(context, points, widths, pixelsPerMM);
        });
      });
    });
    gl.bindTexture(gl.TEXTURE_2D, view.overlay);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
    // The picture is four thousand pixels across and lands on a few hundred on
    // screen, so every screen pixel covers several texels. Taking one bilinear
    // sample of that leaves a thin line hit and miss -- solid here, broken and
    // thin a few pixels along -- which reads as a line of wildly uneven width.
    // Mipmaps average it down instead, and anisotropic filtering keeps it from
    // smearing where the surface turns away.
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var anisotropy = gl.getExtension("EXT_texture_filter_anisotropic");
    if (anisotropy) {
      gl.texParameterf(gl.TEXTURE_2D, anisotropy.TEXTURE_MAX_ANISOTROPY_EXT,
        Math.min(8, gl.getParameter(anisotropy.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    }
    view.overlaySize = size;
  }

  // Neighbour averaging around the ring, to take the mesh's staircase out of
  // the path before it is drawn as a curve.
  function relaxPath(points, passes, weight) {
    var count = points.length / 2;
    if (count < 6) return;
    var scratch = new Float32Array(points.length);
    for (var pass = 0; pass < passes; pass += 1) {
      for (var i = 0; i < count; i += 1) {
        var previous = ((i - 1 + count) % count) * 2;
        var next = ((i + 1) % count) * 2;
        var here = i * 2;
        scratch[here] = points[here] * (1 - weight) +
          (points[previous] + points[next]) * 0.5 * weight;
        scratch[here + 1] = points[here + 1] * (1 - weight) +
          (points[previous + 1] + points[next + 1]) * 0.5 * weight;
      }
      points.set(scratch);
    }
  }

  // The widths are smoothed the way the path is: an abrupt change of width
  // reads as a kink in the line.
  function relaxWidths(widths, passes) {
    var count = widths.length;
    if (count < 4) return;
    var scratch = new Float32Array(count);
    for (var pass = 0; pass < passes; pass += 1) {
      for (var i = 0; i < count; i += 1) {
        var previous = widths[(i - 1 + count) % count];
        var next = widths[(i + 1) % count];
        scratch[i] = widths[i] * 0.5 + (previous + next) * 0.25;
      }
      widths.set(scratch);
    }
  }

  // Canvas strokes are one width for the whole path, so the band is a filled
  // shape instead: the loop offset outwards and then back along its inside.
  // The soft shadow under it is the drop shadow pycortex's overlays carry,
  // which reads as depth rather than as a second, harder line.
  function fillBand(context, points, widths, pixelsPerMM) {
    var count = points.length / 2;
    if (count < 4) return;
    var sides = new Float32Array(count * 2);
    for (var i = 0; i < count; i += 1) {
      var previous = ((i - 1 + count) % count) * 2;
      var next = ((i + 1) % count) * 2;
      var tx = points[next] - points[previous];
      var ty = points[next + 1] - points[previous + 1];
      var length = Math.sqrt(tx * tx + ty * ty) || 1;
      sides[i * 2] = -ty / length;
      sides[i * 2 + 1] = tx / length;
    }
    function ring(sign) {
      for (var i = 0; i <= count; i += 1) {
        var at = (i % count) * 2;
        var x = points[at] + sides[at] * widths[i % count] * sign;
        var y = points[at + 1] + sides[at + 1] * widths[i % count] * sign;
        if (i === 0) context.moveTo(x, y); else context.lineTo(x, y);
      }
    }
    context.save();
    context.beginPath();
    ring(1);
    context.closePath();
    for (var back = count; back >= 0; back -= 1) {
      var at = (back % count) * 2;
      var x = points[at] - sides[at] * widths[back % count];
      var y = points[at + 1] - sides[at + 1] * widths[back % count];
      if (back === count) context.moveTo(x, y); else context.lineTo(x, y);
    }
    context.closePath();
    context.shadowColor = "rgba(0, 0, 0, 0.62)";
    context.shadowBlur = Math.max(2, state.outlineWidth * pixelsPerMM * 0.9);
    context.fillStyle = "rgba(255, 255, 255, 0.97)";
    context.fill("evenodd");
    context.shadowBlur = Math.max(1, state.outlineWidth * pixelsPerMM * 0.45);
    context.fill("evenodd");
    context.restore();
  }

  function strokeCurve(context, points) {
    var count = points.length / 2;
    context.beginPath();
    var startX = (points[0] + points[(count - 1) * 2]) / 2;
    var startY = (points[1] + points[(count - 1) * 2 + 1]) / 2;
    context.moveTo(startX, startY);
    for (var i = 0; i < count; i += 1) {
      var next = ((i + 1) % count) * 2;
      var midX = (points[i * 2] + points[next]) / 2;
      var midY = (points[i * 2 + 1] + points[next + 1]) / 2;
      context.quadraticCurveTo(points[i * 2], points[i * 2 + 1], midX, midY);
    }
    context.closePath();
    context.stroke();
  }

  // ---- morphing --------------------------------------------------------------
  function morphLabel(value) {
    var index = Math.round(value);
    if (Math.abs(value - index) < 0.02) return GEOMETRY_LABELS[GEOMETRY_ORDER[index]];
    var low = Math.floor(value);
    return GEOMETRY_LABELS[GEOMETRY_ORDER[low]] + " → " +
      GEOMETRY_LABELS[GEOMETRY_ORDER[low + 1]];
  }

  // The flat geometry drops the faces that crossed the medial wall, so the
  // mask says which of the base faces survive.
  function maskedFaces(tris, mask) {
    var kept = 0, i = 0;
    for (i = 0; i < mask.length; i += 1) if (mask[i]) kept += 1;
    var out = new Uint32Array(kept * 3);
    var w = 0;
    for (i = 0; i < mask.length; i += 1) {
      if (!mask[i]) continue;
      out[w] = tris[i * 3];
      out[w + 1] = tris[i * 3 + 1];
      out[w + 2] = tris[i * 3 + 2];
      w += 3;
    }
    return out;
  }

  // Opening the hemispheres is a rotation about a vertical axis through the
  // occipital pole, so the visual cortex stays put and the frontal poles swing
  // apart -- and a quarter turn lands them in the arrangement pycortex lays a
  // pair of flat maps out in.
  var OPEN_ANGLE = Math.PI / 2;

  function hemisphereSign(hemisphere) {
    return hemisphere === "lh" ? 1 : -1;
  }

  function swing(vertices, angle, px, py, out) {
    var ca = Math.cos(angle), sa = Math.sin(angle);
    for (var i = 0; i < vertices.length; i += 3) {
      var dx = vertices[i] - px, dy = vertices[i + 1] - py;
      out[i] = px + dx * ca - dy * sa;
      out[i + 1] = py + dx * sa + dy * ca;
      out[i + 2] = vertices[i + 2];
    }
  }

  function occipitalPivot(part) {
    var wm = part.geometries.wm;
    if (!wm) return [0, 0];
    var best = 0;
    for (var v = 1; v < wm.length / 3; v += 1) {
      if (wm[v * 3 + 1] < wm[best * 3 + 1]) best = v;
    }
    return [wm[best * 3], wm[best * 3 + 1]];
  }

  // Vertex arrays are views over the fetch cache's buffers, so the guard is
  // keyed on the buffer: a path whose buffer was evicted and refetched must be
  // prepared again, or the flat map stays unrotated and vanishes edge on.
  var preparedFlat = new WeakSet();

  function prepareFlat(part) {
    var flat = part.geometries.flat;
    if (!flat || preparedFlat.has(flat.buffer)) return;
    var pivot = part.pivot;
    var sign = hemisphereSign(part.hemisphere);
    var standing = new Float32Array(flat.length);
    for (var i = 0; i < flat.length; i += 3) {
      standing[i] = flat[i];
      standing[i + 1] = 0;
      standing[i + 2] = flat[i + 1];
    }
    swing(standing, -sign * OPEN_ANGLE, pivot[0], pivot[1], flat);
    preparedFlat.add(flat.buffer);
  }

  // Everything the sliders drive is eased rather than applied.
  var anim = { morph: 2, split: 0, frame: null, last: 0 };
  var EASE_SECONDS = 0.45;

  function requestSurfaceFrame() {
    if (anim.frame !== null || !surfaceParts.length) return;
    anim.last = 0;
    anim.frame = window.requestAnimationFrame(surfaceFrame);
  }

  function surfaceFrame(now) {
    anim.frame = null;
    var elapsed = anim.last ? Math.min((now - anim.last) / 1000, 0.1) : 1 / 60;
    anim.last = now;
    var EASE = 1 - Math.exp(-elapsed / EASE_SECONDS);
    var dm = state.morph - anim.morph;
    var ds = state.split - anim.split;
    if (Math.abs(dm) < 0.0008 && Math.abs(ds) < 0.0008) {
      anim.morph = state.morph;
      anim.split = state.split;
      applyMorph();
      // The outline picture is drawn for whichever geometry is showing, so it
      // is redrawn once the motion stops rather than on every frame.
      drawRegionTexture();
      viewDraw();
      return;
    }
    anim.morph += dm * EASE;
    anim.split += ds * EASE;
    applyMorph();
    if (anim.frame === null) anim.frame = window.requestAnimationFrame(surfaceFrame);
  }

  function flatWeightFor(value) {
    return Math.max(0, Math.min(1, value - 2));
  }

  // A flat map has to be fully open to be readable, so flatness floors the
  // opening; below that the reader's own setting stands.
  function effectiveSplit() {
    return Math.max(anim.split, flatWeightFor(anim.morph));
  }

  function applyMorph() {
    if (!surfaceParts.length) return;
    var value = Math.max(0, Math.min(3, anim.morph));
    var low = Math.min(2, Math.floor(value));
    var t = value - low;
    var fromName = GEOMETRY_ORDER[low];
    var toName = GEOMETRY_ORDER[low + 1];
    var split = effectiveSplit();
    var angle = OPEN_ANGLE * split;

    surfaceParts.forEach(function (part) {
      var from = part.geometries[fromName] || part.geometries.wm;
      var to = part.geometries[toName] || from;
      var sign = hemisphereSign(part.hemisphere);
      var ca = Math.cos(angle * sign), sa = Math.sin(angle * sign);

        if (!tap || event.touches.length || !event.changedTouches.length) { tap = null; return; }
        var end = event.changedTouches[0];
        var dx = end.clientX - tap.x, dy = end.clientY - tap.y;
        var quick = Date.now() - tap.at < 800;
        tap = null;
        if (Math.sqrt(dx * dx + dy * dy) > 12 || !quick) return;
        var rect = canvas.getBoundingClientRect();
        try { instance.mouseClick(end.clientX - rect.left, end.clientY - rect.top); } catch (ignored) {}
      }, true);
    });
  }

  // The surface has its own canvas, so its navigation is its own too: drag to
  // turn, middle drag or a flat-map drag to pan, wheel or right drag to zoom,
  // two fingers to pinch and slide.
  function wireSurfaceNavigation() {
    var canvas = el["surface-gl"];
    var turning = null, panning = null, zooming = null;

    canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
    canvas.addEventListener("pointerdown", function (event) {
      if (state.mode !== "surface") return;
      try { canvas.setPointerCapture(event.pointerId); } catch (ignored) {}
      if (event.button === 2) zooming = [event.clientX, event.clientY];
      else if (event.button === 1 || rotationLocked()) panning = [event.clientX, event.clientY];
      else if (event.button === 0) turning = [event.clientX, event.clientY];
      event.preventDefault();
    });
    canvas.addEventListener("pointermove", function (event) {
      if (state.mode !== "surface") return;
      if (turning) {
        state.azimuth = (state.azimuth - (event.clientX - turning[0]) * 0.4 + 360) % 360;
        state.elevation = Math.max(-89, Math.min(89,
          state.elevation + (event.clientY - turning[1]) * 0.4));
        cameraHeld = { azimuth: state.azimuth, elevation: state.elevation };
        turning = [event.clientX, event.clientY];
        viewDraw();
      } else if (panning) {
        shiftPan(event.clientX - panning[0], event.clientY - panning[1]);
        panning = [event.clientX, event.clientY];
        viewDraw();
      } else if (zooming) {
        var travel = (event.clientX - zooming[0]) + (zooming[1] - event.clientY);
        state.surfaceZoom = Math.min(Math.max(state.surfaceZoom * Math.exp(travel * 0.006), 0.2), 12);
        zooming = [event.clientX, event.clientY];
        viewDraw();
      }
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (name) {
      canvas.addEventListener(name, function () {
        turning = null; panning = null; zooming = null;
      });
    });
    canvas.addEventListener("wheel", function (event) {
      if (state.mode !== "surface") return;
      state.surfaceZoom = Math.min(Math.max(
        state.surfaceZoom * Math.exp(-event.deltaY * 0.0015), 0.2), 12);
      viewDraw();
      event.preventDefault();
    }, { passive: false });

    var gesture = null;
    canvas.addEventListener("touchstart", function (event) {
      if (event.touches.length > 1) touchState.multiAt = Date.now();
      gesture = event.touches.length === 2 ? measureTouches(event.touches) : null;
    }, true);
    canvas.addEventListener("touchmove", function (event) {
      if (event.touches.length > 1) touchState.multiAt = Date.now();
      if (event.touches.length !== 2) { gesture = null; return; }
      var now = measureTouches(event.touches);
      if (gesture) {
        if (gesture.spread > 4) {
          state.surfaceZoom = Math.min(Math.max(
            state.surfaceZoom * (now.spread / gesture.spread), 0.2), 12);
        }
        shiftPan(now.x - gesture.x, now.y - gesture.y);
        viewDraw();
      }
      gesture = now;
      event.preventDefault();
      event.stopPropagation();
    }, true);
    ["touchend", "touchcancel"].forEach(function (name) {
      canvas.addEventListener(name, function () {
        if (gesture) touchState.multiAt = Date.now();
        gesture = null;
      }, true);
    });
  }

  // A tap or a click that stayed put picks a vertex; a drag turns the brain.
  function wireSurfacePicking() {
    var canvas = el["surface-gl"];
    var began = null;
    canvas.addEventListener("pointerdown", function (event) {
      if (state.mode !== "surface") { began = null; return; }
      if (event.pointerType === "mouse" && event.button !== 0) { began = null; return; }
      if (event.pointerType === "touch" && Date.now() - touchState.multiAt < 350) {
        began = null;
        return;
      }
      began = { id: event.pointerId, x: event.clientX, y: event.clientY, at: Date.now() };
    }, true);
    canvas.addEventListener("pointerup", function (event) {
      var start = began;
      began = null;
      if (state.mode !== "surface" || !start || event.pointerId !== start.id) return;
      var dx = event.clientX - start.x, dy = event.clientY - start.y;
      if (Math.sqrt(dx * dx + dy * dy) > 12) return;
      if (Date.now() - start.at > 800) return;
      if (Date.now() - touchState.multiAt < 350) return;
      reportPick(pickVertex(event));
    }, true);
  }

  // ---- building --------------------------------------------------------------
  function restyleSurface() {
    viewDraw();
  }

  function refreshCurvature() {
    viewDraw();
  }

  function buildSurface() {
    var surfaces = state.manifest.surfaces || {};
    if (state.surfaceSpace === "fsnative" && !surfaces[state.subject] && surfaces.fsaverage) {
      state.surfaceSpace = "fsaverage";
      setPressed(el["surface-spaces"], "data-surface-space", state.surfaceSpace);
    }
    var record = surfaceRecord();
    el["surface-field"].hidden = false;
    syncSurfaceSpaceButtons();
    if (!record) {
      el.loading.hidden = false;
      el.loading.textContent = state.subject === "group"
        ? "Surfaces are per subject; the group map has no anatomy to project onto. "
          + "Pick a subject-level endpoint."
        : "no surfaces exported for " + state.subject;
      return;
    }
    if (!viewInit()) {
      el.loading.hidden = false;
      el.loading.textContent = "this browser cannot open a WebGL2 context for surfaces";
      return;
    }
    var token = ++loadToken;
    el.loading.hidden = false;
    el.loading.textContent = "loading surfaces…";
    teardownPanels();
    var fsaverage = state.surfaceSpace === "fsaverage";
    var entry = fsaverage ? currentMap() : subjectSpaceEntry();
    if (!entry) {
      el.loading.textContent = fsaverage
        ? "this endpoint has no MNI map to project"
        : "this endpoint has no subject-space map to project";
      return;
    }
    var transform = fsaverage ? record.volume_transform : null;
    viewRelease();
    surfaceParts = [];
    markerAt = null;
    var wanted = ["lh", "rh"].filter(function (h) {
      return state.hemispheres[h] && record.hemispheres[h];
    });
    Promise.all([
      loadImage(entry.path),
      // NiiVue's loader is the quickest way to unpack an mz3; the faces come
      // out of it and the mesh itself is dropped straight away.
      nv.loadMeshes(wanted.map(function (h) {
        return { url: record.hemispheres[h].mesh };
      }))
    ]).then(function (results) {
      if (token !== loadToken) return;
      var image = results[0];
      var sample = transformedSampler(volumeSampler(image), transform);
      var meshes = nv.meshes.slice(0, wanted.length);
      var faces = meshes.map(function (mesh) { return new Uint32Array(mesh.tris); });
      while (nv.meshes.length) {
        try { nv.removeMesh(nv.meshes[0]); } catch (ignored) { break; }
      }
      return Promise.all(wanted.map(function (hemisphere, index) {
        var info = record.hemispheres[hemisphere];
        var jobs = [];
        var names = [];
        GEOMETRY_ORDER.forEach(function (name) {
          var geometry = info.geometries[name];
          if (!geometry) return;
          names.push(name);
          jobs.push(fetchBinary(geometry.vertices));
        });
        var flat = info.geometries.flat || {};
        jobs.push(flat.face_mask ? fetchBinary(flat.face_mask) : Promise.resolve(null));
        jobs.push(info.curvature ? fetchBinary(info.curvature) : Promise.resolve(null));
        return Promise.all(jobs).then(function (buffers) {
          if (token !== loadToken) return;
          var geometries = {};
          names.forEach(function (name, i) {
            geometries[name] = new Float32Array(buffers[i]);
          });
          var maskBuffer = buffers[names.length];
          var curvBuffer = buffers[names.length + 1];
          var baseTris = faces[index];
          var count = geometries.wm.length / 3;
          var part = {
            mesh: { pts: new Float32Array(geometries.wm) },
            hemisphere: hemisphere,
            geometries: geometries,
            baseTris: baseTris,
            flatTris: maskBuffer ? maskedFaces(baseTris, new Uint8Array(maskBuffer)) : null,
            curvature: curvBuffer ? new Float32Array(curvBuffer) : null
          };
          part.pivot = occipitalPivot(part);
          prepareFlat(part);
          // Values are sampled once, on the anatomical white surface, and ride
          // along with the vertices through every morph.
          var values = new Float32Array(count);
          var anatomical = geometries.wm;
          for (var v = 0; v < count; v += 1) {
            values[v] = sample(anatomical[v * 3], anatomical[v * 3 + 1],
                               anatomical[v * 3 + 2]) || 0;
          }
          part.values = values;
          surfaceParts.push(part);
        });
      }));
    }).then(function () {
      if (token !== loadToken) return;
      surfaceParts.sort(function (a, b) { return a.hemisphere < b.hemisphere ? -1 : 1; });
      viewBuild();
      anim.morph = state.morph;
      anim.split = state.split;
      cameraSplit = null;
      syncSurfaceControls();
      renderRegionList();
      paintSurfaceRegions();
      applyMorph();
      el.loading.hidden = true;
      el.selection.textContent = state.report.label + " · " + state.endpoint.label +
        (state.feature ? " · " + state.feature : "") + " · " + state.subject +
        " · " + morphLabel(state.morph) + " surface";
    }).catch(function (error) {
      el.loading.textContent = "surface failed: " + error.message;
    });
  }

  function syncSurfaceSpaceButtons() {
    var surfaces = state.manifest.surfaces || {};
    Array.prototype.forEach.call(el["surface-spaces"].children, function (node) {
      var space = node.getAttribute("data-surface-space");
      node.disabled = space === "fsaverage" ? !surfaces.fsaverage : !surfaces[state.subject];
    });
    setPressed(el["surface-spaces"], "data-surface-space", state.surfaceSpace);
  }

  function syncSurfaceControls() {
    var flat = flatWeightFor(state.morph) >= 1;
    el.morph.value = Math.round(state.morph * 100);
    el["morph-value"].textContent = morphLabel(state.morph);
    el.separation.value = flat ? 100 : Math.round(state.split * 100);
    el.separation.disabled = flat;
    el.curvature.value = Math.round(state.curvature * 100);
    setPressed(el.geometries, "data-geometry",
      Math.abs(state.morph - Math.round(state.morph)) < 0.02
        ? GEOMETRY_ORDER[Math.round(state.morph)] : "");
  }

  function setMorphTarget(value) {
    state.morph = Math.max(0, Math.min(3, value));
    syncSurfaceControls();
    requestSurfaceFrame();
  }

  // A montage panel is its own WebGL context, and browsers hand out about
  // sixteen before they start dropping the oldest, so a cohort larger than a
  // page is shown a page at a time rather than all at once and broken.
  var MONTAGE_PAGE = 12;

  function montagePages() {
    if (!state.endpoint) return 1;
    return Math.max(Math.ceil(state.endpoint.subjects.length / MONTAGE_PAGE), 1);
  }

  function montageSubjects() {
    var all = state.endpoint.subjects;
    if (all.length <= MONTAGE_PAGE) return all;
    var page = Math.min(Math.max(state.montagePage, 0), montagePages() - 1);
    return all.slice(page * MONTAGE_PAGE, page * MONTAGE_PAGE + MONTAGE_PAGE);
  }

  function renderMontagePager() {
    var all = state.endpoint ? state.endpoint.subjects : [];
    var paged = state.view === "montage" && all.length > MONTAGE_PAGE;
    el["montage-page-field"].hidden = !paged;
    if (!paged) return;
    var page = Math.min(Math.max(state.montagePage, 0), montagePages() - 1);
    var first = page * MONTAGE_PAGE + 1;
    var last = Math.min(first + MONTAGE_PAGE - 1, all.length);
    el["montage-page-value"].textContent = first + "–" + last + " of " + all.length;
    el["montage-prev"].disabled = page === 0;
    el["montage-next"].disabled = page >= montagePages() - 1;
  }

  function stepMontagePage(delta) {
    var page = Math.min(Math.max(state.montagePage + delta, 0), montagePages() - 1);
    if (page === state.montagePage) return;
    state.montagePage = page;
    renderMontagePager();
    showPanels(panelSpecs());
  }

  function panelSpecs() {
    if (!state.endpoint || state.mode === "surface") return null;
    if (state.view === "montage") {
      return montageSubjects().map(function (subject) {
        return { label: subject, subject: subject, slice: "axial" };
      });
    }
    if (state.view === "multi") {
      return ["axial", "coronal", "sagittal"].map(function (plane) {
        return { label: plane, subject: state.subject, slice: plane };
      });
    }
    return null;
  }

  function applyMode() {
    if (!state.endpoint) return;
    var surface = state.mode === "surface";
    el["surface-field"].hidden = !surface;
    el["view-field"].hidden = surface;
    // MNI and subject T1 are volume spaces; a surface lives on fsnative or
    // fsaverage, so the two selectors swap rather than coexist.
    el["space-field"].hidden = surface || !feature("subjectSpace");
    el["surface-space-field"].hidden = !surface;
    // Hidden rather than merely cleared: clearing depends on an animation
    // frame that a montage rebuild can starve for a second or two, and
    // outlines left hanging over the slices read as a bug.
    el.annotations.style.display = surface ? "block" : "none";
    el["surface-gl"].hidden = !surface;
    document.getElementById("gl").style.visibility = surface ? "hidden" : "visible";
    try {
      var layer = el.annotations;
      if (layer.width) layer.getContext("2d").clearRect(0, 0, layer.width, layer.height);
    } catch (ignored) {}
    el["morph-field"].hidden = !surface;
    el["separation-field"].hidden = !surface;
    el["curvature-field"].hidden = !surface;
    el["outline-width-field"].hidden = !surface;
    el["montage-slice-field"].hidden = true;
    setPressed(el.modes, "data-mode-kind", state.mode);
    var regionLabel = el["roi-opacity-field"].querySelector(".label");
    regionLabel.firstChild.nodeValue = surface ? "Outlines" : "Regions";
    regionLabel.querySelector(".hint").setAttribute("data-tip", surface
      ? "Opacity of the region outlines drawn on the surface. Press S to blink them off and back."
      : "Opacity of the selected atlas regions. Press S to blink them off and back.");
    renderRegionList();
    if (surface) {
      teardownPanels();
      buildSurface();
    } else {
      clearSurface();
      applyView();
    }
  }

  // Meshes outlive a mode switch unless they are explicitly dropped, which is
  // why the surface used to stay painted over the slices.
  function clearSurface() {
    surfaceParts = [];
    viewRelease();
    // Clear the annotation layer outright rather than leaving it to the
    // watcher: rebuilding a montage can starve the animation frame for a
    // second or two, and outlines hanging over the slices that long look like
    // a bug.
    try {
      var layer = el.annotations;
      if (layer && layer.width) {
        layer.getContext("2d").clearRect(0, 0, layer.width, layer.height);
      }
    } catch (ignored) {}
    lastMatrix = null;
    view.mvp = null;
    drawAnnotations(true);
    markerAt = null;
    state.surfacePan = [0, 0];
    state.surfaceZoom = 1;
    if (!nv) return;
    while (nv.meshes.length) {
      try { nv.removeMesh(nv.meshes[0]); } catch (ignored) { break; }
    }
    nv.drawScene();
  }

  function applyView() {
    if (state.mode === "surface") { buildSurface(); return; }
    el["surface-field"].hidden = true;
    var specs = panelSpecs();
    var panelled = specs !== null;
    el.montage.hidden = !panelled;
    el["montage-slice-field"].hidden = state.view !== "montage";
    renderMontagePager();
    el["subject-field"].hidden = state.view === "montage";
    if (panelled) { showPanels(specs); return; }
    teardownPanels();
    if (!nv) return;
    try { nv.resizeListener(); } catch (ignored) {}
    var map = {
      axial: nv.sliceTypeAxial, coronal: nv.sliceTypeCoronal,
      sagittal: nv.sliceTypeSagittal, render: nv.sliceTypeRender
    };
    nv.setSliceType(map[state.view]);
    // Coming back from a panel view the main instance still holds only the
    // underlay, so the overlay has to be put back.
    if (nv.volumes.length < 2) loadOverlay(); else nv.drawScene();
  }

  function teardownPanels() {
    el.montage.hidden = true;
    montageViews.forEach(function (view) {
      // Dropping the volumes first lets their typed arrays go with the
      // context, rather than waiting on whatever still references the
      // instance.
      try {
        while (view.nv.volumes.length) {
          view.nv.removeVolume(view.nv.volumes[view.nv.volumes.length - 1]);
        }
      } catch (ignored) {}
      view.toMNI = null;
      view.fromMNI = null;
      try { view.nv.gl.getExtension("WEBGL_lose_context").loseContext(); } catch (ignored) {}
    });
    montageViews = [];
    el.montage.textContent = "";
  }

  function linkThroughMNI() {
    var specs = (state.manifest.subject_space || {}).coords || {};
    var needed = montageViews.filter(function (view) { return specs[view.subject]; });
    if (needed.length < 2) return;
    Promise.all(needed.map(function (view) {
      return Promise.all([
        loadCoordField(specs[view.subject].anat_to_mni),
        loadCoordField(specs[view.subject].mni_to_anat)
      ]).then(function (fields) {
        view.toMNI = fields[0];
        view.fromMNI = fields[1];
        return view;
      });
    })).then(function (views) {
      var syncing = false;
      views.forEach(function (source) {
        source.nv.onLocationChange = function (location) {
          reportLocation(location);
          if (syncing || !location || !location.mm) return;
          var mni = sampleField(source.toMNI, Array.from(location.mm).slice(0, 3));
          if (!mni) return;
          syncing = true;
          views.forEach(function (target) {
            if (target === source) return;
            var anat = sampleField(target.fromMNI, mni);
            if (!anat) return;
            try {
              target.nv.scene.crosshairPos = target.nv.mm2frac(anat);
              target.nv.drawScene();
            } catch (ignored) {}
          });
          syncing = false;
          el.coords.textContent = mni.map(function (v) { return Math.round(v); }).join(", ");
        };
      });
      el.diagnostic.textContent = "crosshairs linked through MNI across " + views.length + " subjects";
    }).catch(function (error) {
      el.diagnostic.textContent = "coordinate linkage failed: " + error.message;
    });
  }

  function linkDirect() {
    var syncing = false;
    montageViews.forEach(function (view) {
      view.nv.onLocationChange = function (location) {
        reportLocation(location);
        if (syncing) return;
        syncing = true;
        var position = Array.from(view.nv.scene.crosshairPos);
        montageViews.forEach(function (other) {
          if (other === view) return;
          other.nv.scene.crosshairPos = position.slice();
          other.nv.drawScene();
        });
        syncing = false;
      };
    });
  }

  function mapForSubject(subject) {
    if (state.space === "subject") {
      var found = null;
      ((state.manifest.subject_space || {}).maps || []).forEach(function (m) {
        if (m.report === state.report.id && m.endpoint === state.endpoint.id &&
            m.feature === state.feature && m.subject === subject) found = m;
      });
      return found;
    }
    for (var i = 0; i < state.endpoint.maps.length; i += 1) {
      var m = state.endpoint.maps[i];
      if (m.subject === subject && m.feature === state.feature) return m;
    }
    return null;
  }

  // 1 mm anatomy under a native-resolution overlay. NiiVue composites the
  // overlay onto the underlay grid, so the map ends up nearest-upsampled to
  // 1 mm: blocky data over a sharp brain, which is the intended look.
  // NiiVue composites every overlay onto the underlay's grid, so the underlay
  // resolution sets the size of the RGBA blend texture each panel holds: about
  // 29 MB at 1 mm against 3.6 MB at 2 mm. One or three panels can afford the
  // sharp one; eight of them is a quarter of a gigabyte of texture, which is
  // more than a phone has to give.
  function underlayFor(subject, coarse) {
    var space = state.manifest.subject_space;
    if (state.space === "subject") {
      var fine = space.templates[subject];
      return coarse && space.templates_2mm ? (space.templates_2mm[subject] || fine) : fine;
    }
    return coarse ? (state.manifest.template_montage || state.manifest.template)
                  : state.manifest.template;
  }

  // Two reasons to drop to the coarse underlay. A montage cell is a quarter
  // of the window wide, where 1 mm anatomy is not something you can see. And a
  // map that is itself 2 or 3 mm gains nothing from a 1 mm blend grid at any
  // size: NiiVue composites the overlay onto the underlay, so the fine one
  // costs eight times the texture per panel and shows the same blocky voxels.
  // On this page that was most of the wait when switching endpoint.
  function coarseMap(entry) {
    if ((state.manifest.features || {}).fineUnderlay !== false) return false;
    var zooms = entry && entry.zooms;
    if (!zooms || !zooms.length) return false;
    return Math.min.apply(null, zooms) >= 1.8;
  }

  function coarseUnderlay(specs) {
    if (specs && specs.length > 3) return true;
    return coarseMap(styleEntry());
  }

  // Rebuilding panels means recreating WebGL contexts and reloading the
  // underlay, which is most of the cost of a switch. When only the map changes
  // the existing panels can keep everything and swap volume 1.
  function panelShape(specs) {
    if (!specs) return "";
    // The space and the underlay resolution belong in the key: swapping only
    // the map would otherwise leave an MNI underlay under a subject-space
    // overlay, or a 2 mm one under a view that wants 1 mm.
    return state.space + "::" +
      specs.map(function (s) { return s.subject + "|" + s.slice; }).join(",");
  }

  function swapOverlays(specs) {
    var token = ++loadToken;
    return Promise.all(specs.map(function (spec, index) {
      var entry = mapForSubject(spec.subject);
      var view = montageViews[index];
      if (!entry || !view) return null;
      return loadImage(entry.path).then(function (image) {
        if (token !== loadToken) return null;
        while (view.nv.volumes.length > 1) {
          view.nv.removeVolume(view.nv.volumes[view.nv.volumes.length - 1]);
        }
        view.nv.addVolume(image);
        view.entry = entry;
        return view;
      });
    })).then(function () {
      if (token !== loadToken) return;
      refreshStyle();
      refreshRegions();
      el.loading.hidden = true;
      prefetchSiblings();
    });
  }

  function showPanels(specs) {
    if (montageViews.length === specs.length && panelSpace === state.space &&
        panelCoarse === coarseUnderlay(specs) &&
        panelShape(specs) === panelShape(montageViews.map(function (v) {
          return { subject: v.subject, slice: v.slice };
        }))) {
      el.loading.hidden = true;
      swapOverlays(specs);
      return;
    }
    buildPanels(specs);
  }

  function buildPanels(specs) {
    var coarse = coarseUnderlay(specs);
    teardownPanels();
    panelSpace = state.space;
    panelCoarse = coarse;
    // buildPanels is reached at startup as well as from a view click, so it
    // owns the container's visibility rather than leaving it to applyView.
    el.montage.hidden = false;
    el["montage-slice-field"].hidden = state.view !== "montage";
    renderMontagePager();
    el["subject-field"].hidden = state.view === "montage";
    var token = ++loadToken;
    el.loading.hidden = false;
    el.loading.textContent = "building view…";
    // Three columns on a phone leaves cells too small to pinch inside, let
    // alone read, so a narrow window gets at most two.
    // matchMedia, not innerWidth: the CSS breakpoints are what decide how wide
    // a cell ends up, and innerWidth disagrees with them under device
    // emulation and on any page without a layout viewport of its own.
    var narrow = window.matchMedia("(max-width: 760px)").matches;
    var columns = Math.min(specs.length, narrow ? 2 : 4);
    el.montage.style.gridTemplateColumns = "repeat(" + columns + ", 1fr)";
    var pending = specs.map(function (spec) {
      var entry = mapForSubject(spec.subject);
      if (!entry) return Promise.resolve(null);
      var cell = document.createElement("div");
      cell.className = "cell";
      var canvas = document.createElement("canvas");
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = spec.label;
      cell.appendChild(canvas);
      cell.appendChild(tag);
      el.montage.appendChild(cell);
      var instance = new Niivue({
        backColor: [0.02, 0.03, 0.04, 1], show3Dcrosshair: false,
        isColorbar: false, isNearestInterpolation: true,
        dragMode: DRAG.pan, scrollRequiresFocus: true,
        mouseEventConfig: { rightButton: DRAG.none, centerButton: DRAG.pan }
      });
      registerColormaps(instance);
      registerRegionColormap(instance);
      return instance.attachToCanvas(canvas)
        .then(function () {
          return Promise.all([
            loadImage(underlayFor(spec.subject, coarse)),
            loadImage(entry.path)
          ]);
        })
        .then(function (images) {
          images[0].colormap = "gray";
          instance.addVolume(images[0]);
          instance.addVolume(images[1]);
          var slices = {
            axial: instance.sliceTypeAxial,
            coronal: instance.sliceTypeCoronal,
            sagittal: instance.sliceTypeSagittal
          };
          instance.setSliceType(slices[spec.slice]);
          keepUnfocused(canvas);
          wireZoom(instance, canvas);
          wireTouchGestures(instance, canvas);
          wireWheel(instance, canvas, function () {
            return { axial: 2, coronal: 1, sagittal: 0 }[spec.slice];
          });
          try { instance.setInterpolation(true); } catch (ignored) {}
          instance.onLocationChange = reportLocation;
          return { nv: instance, entry: entry, subject: spec.subject, slice: spec.slice };
        });
    });
    Promise.all(pending).then(function (views) {
      if (token !== loadToken) return;
      montageViews = views.filter(Boolean);
      var manySubjects = montageViews.some(function (v) {
        return v.subject !== montageViews[0].subject;
      });
      if (state.space === "subject" && manySubjects) linkThroughMNI();
      else linkDirect();
      refreshStyle();
      refreshRegions();
      if (state.view === "montage") applyMontageSlice();
      el.loading.hidden = true;
    }).catch(function (error) {
      el.loading.textContent = "view failed: " + error.message;
    });
  }

  function applyMontageSlice() {
    var fraction = el["montage-slice"].value / 100;
    el["montage-slice-value"].textContent = Math.round(fraction * 100) + "%";
    montageViews.forEach(function (view) {
      view.nv.scene.crosshairPos = [0.5, 0.5, fraction];
      view.nv.drawScene();
    });
  }

  function renderRail() {
    el.reports.textContent = "";
    state.manifest.reports.forEach(function (report) {
      var node = document.createElement("button");
      node.type = "button"; node.className = "item";
      node.setAttribute("aria-pressed", report === state.report ? "true" : "false");
      node.innerHTML = "<span></span><span class='sub'></span>";
      node.children[0].textContent = report.label;
      node.children[1].textContent = report.endpoints.length + " endpoints";
      node.addEventListener("click", function () { selectReport(report); });
      el.reports.appendChild(node);
    });
    el.endpoints.textContent = "";
    state.report.endpoints.forEach(function (endpoint) {
      var node = document.createElement("button");
      node.type = "button"; node.className = "item";
      node.setAttribute("aria-pressed", endpoint === state.endpoint ? "true" : "false");
      node.textContent = endpoint.label;
      node.addEventListener("click", function () { selectEndpoint(endpoint); });
      el.endpoints.appendChild(node);
    });
    el.blurb.textContent = state.endpoint.blurb;
    // An endpoint that says nothing about how it got into the template space
    // gets no badge, rather than an empty one.
    var badge = el["warp-badge"];
    badge.hidden = !state.endpoint.warp;
    badge.textContent = state.endpoint.warp + " warp to MNI";
    badge.className = "badge" + (state.endpoint.warp === "affine" ? " affine" : "");
  }

  function renderBar() {
    if (!state.endpoint) return;
    var features = state.endpoint.features;
    var hasFeatures = features.length > 1 || (features.length === 1 && features[0].id !== "");
    el["feature-field"].hidden = !hasFeatures;
    el.features.textContent = "";
    if (hasFeatures) {
      features.forEach(function (feature) {
        var node = document.createElement("button");
        node.type = "button"; node.textContent = feature.label;
        node.setAttribute("aria-pressed", feature.id === state.feature ? "true" : "false");
        node.addEventListener("click", function () {
          state.feature = feature.id; renderBar();
          if (panelSpecs()) showPanels(panelSpecs()); else loadOverlay();
        });
        el.features.appendChild(node);
      });
    }
    el.subjects.textContent = "";
    state.endpoint.subjects.forEach(function (subject) {
      var node = document.createElement("button");
      node.type = "button"; node.textContent = subject;
      node.setAttribute("aria-pressed", subject === state.subject ? "true" : "false");
      node.addEventListener("click", function () {
        state.subject = subject; renderBar();
        if (panelSpecs()) showPanels(panelSpecs()); else loadOverlay();
      });
      el.subjects.appendChild(node);
    });
    if (state.montagePage >= montagePages()) state.montagePage = 0;
    var statisticalNow = state.endpoint.statistic === "t";
    el["threshold-modes"].hidden = !statisticalNow;
    el["threshold-mode-field"].hidden = !statisticalNow;
    if (!statisticalNow && state.thresholdMode !== "value") {
      state.thresholdMode = "value";
      setPressed(el["threshold-modes"], "data-mode", "value");
    }
    var hasSubjectSpace = subjectSpaceEntry() !== null;
    el.spaces.children[1].disabled = !hasSubjectSpace;
    if (!hasSubjectSpace && state.space === "subject") state.space = "mni";
    setPressed(el.spaces, "data-space", state.space);
    Array.prototype.forEach.call(el.views.children, function (node) {
      var view = node.getAttribute("data-view");
      if (view === "montage") node.disabled = state.endpoint.subjects.length < 2;
    });
    el.modes.children[1].disabled = !surfacesAvailable() || !feature("surface");
    if (!surfacesAvailable() && state.mode === "surface") state.mode = "volume";
    setPressed(el.modes, "data-mode-kind", state.mode);
  }

  function resetWindow() {
    var high = state.endpoint.range[1];
    el["window-max"].value = Number(high.toPrecision(3));
    retuneStep(el["window-max"]);
    if (state.thresholdMode === "value") {
      // A fifth of the window is a reasonable default, but an endpoint can
      // ask for its own: in a comparison where one condition is far weaker
      // than the others, a threshold scaled to the shared window hides it.
      var low = state.endpoint.range[0];
      var floor = low > 0 && low < high ? low : high * 0.2;
      el["threshold-input"].value = Number(floor.toPrecision(3));
    }
    retuneStep(el["threshold-input"]);
    refreshStyle();
  }

  function selectReport(report) {
    state.report = report;
    selectEndpoint(report.endpoints[0]);
  }

  // Comparing two endpoints means comparing them at one window, so a switch
  // keeps whatever the reader has dialled in as long as the new endpoint asks
  // for the same range. It only resets when the endpoint declares a different
  // one, which is how a viewer says "this is a different quantity" -- a group
  // average beside the individual maps it was made from, say.
  function sameWindow(a, b) {
    if (!a || !b) return false;
    return Math.abs(a[0] - b[0]) < 1e-9 && Math.abs(a[1] - b[1]) < 1e-9;
  }

  function selectEndpoint(endpoint) {
    var carried = sameWindow(state.endpoint && state.endpoint.range, endpoint.range);
    state.endpoint = endpoint;
    state.feature = endpoint.features.length ? endpoint.features[0].id : "";
    if (endpoint.subjects.indexOf(state.subject) === -1) state.subject = endpoint.subjects[0];
    if (endpoint.subjects.length < 2 && state.view === "montage") state.view = "multi";
    renderRail(); renderBar();
    if (carried) syncDual(); else resetWindow();
    applyMode();
  }

  function loadOverlay() {
    if (!nv) return;
    var subjectEntry = inSubjectSpace() ? subjectSpaceEntry() : null;
    var entry = subjectEntry || currentMap();
    if (!entry) return;
    var wantedTemplate = underlayFor(state.subject, coarseUnderlay(null));
    var token = ++loadToken;
    el.loading.hidden = false;
    el.loading.textContent = "loading…";
    el.selection.textContent = state.report.label + " · " + state.endpoint.label +
      (state.feature ? " · " + state.feature : "") + " · " + state.subject +
      (subjectEntry ? " · subject T1" : "");

    var templateReady = wantedTemplate === loadedTemplate
      ? Promise.resolve(null)
      : loadImage(wantedTemplate);
    Promise.all([templateReady, loadImage(entry.path)]).then(function (images) {
      if (token !== loadToken) return;
      if (images[0]) {
        while (nv.volumes.length) nv.removeVolume(nv.volumes[nv.volumes.length - 1]);
        images[0].colormap = "gray";
        nv.addVolume(images[0]);
        loadedTemplate = wantedTemplate;
      } else {
        while (nv.volumes.length > 1) nv.removeVolume(nv.volumes[nv.volumes.length - 1]);
      }
      nv.addVolume(images[1]);
      try { nv.setInterpolation(true); } catch (ignored) {}
      refreshStyle();
      el.loading.hidden = true;
      prefetchSiblings();
    }).catch(function (error) {
      if (token !== loadToken) return;
      el.loading.hidden = false;
      el.loading.textContent = "could not load " + entry.path + " — " + error.message;
    });
  }

  // NiiVue's right-drag adjusts brightness and contrast, which is easy to
  // trigger by accident and hard to undo. Right drag zooms instead.
  function keepUnfocused(canvas) {
    canvas.addEventListener("focus", function () { canvas.blur(); });
  }

  function wireZoom(instance, canvas) {
    var dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
    canvas.addEventListener("pointerdown", function (event) {
      if (event.button !== 2) return;
      dragging = true; lastX = event.clientX; lastY = event.clientY;
      try { canvas.setPointerCapture(event.pointerId); } catch (ignored) {}
      event.preventDefault();
      event.stopPropagation();
    }, true);
    canvas.addEventListener("pointermove", function (event) {
      if (!dragging) return;
      // Up or right zooms in, down or left zooms out, so either axis of the
      // drag does what it looks like it should.
      var travel = (event.clientX - lastX) + (lastY - event.clientY);
      var factor = Math.exp(travel * 0.006);
      // volScaleMultiplier is the 3D render zoom; the 2D slice views are
      // scaled by the fourth element of pan2Dxyzmm.
      var pan = instance.scene.pan2Dxyzmm;
      if (pan && pan.length > 3) {
        pan[3] = Math.min(Math.max(pan[3] * factor, 0.4), 12);
        instance.scene.pan2Dxyzmm = pan;
      }
      var scale = instance.scene.volScaleMultiplier || 1;
      instance.scene.volScaleMultiplier = Math.min(Math.max(scale * factor, 0.4), 8);
      lastX = event.clientX;
      lastY = event.clientY;
      instance.drawScene();
      event.preventDefault();
      event.stopPropagation();
    }, true);
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (name) {
      canvas.addEventListener(name, function () { dragging = false; }, true);
    });
  }

  // NiiVue's own wheel handling does not step slices here, so the page does
  // it: one notch moves the crosshair one voxel along the axis the hovered
  // view is cutting through.
  function wireWheel(instance, canvas, axisFor) {
    // NiiVue registers its own wheel listener on the canvas first, and a
    // listener on the same element cannot cancel one registered earlier.
    // Listening on the parent during the capture phase runs before it, so
    // stopping propagation there keeps NiiVue's zoom out of the way.
    var host = canvas.parentElement || canvas;
    host.addEventListener("wheel", function (event) {
      // The main view's host is an ancestor of the panel cells, so without
      // this guard it would swallow wheel events aimed at a panel.
      if (event.target !== canvas) return;
      var axis = axisFor(event);
      if (axis === null) return;
      var position = Array.from(instance.scene.crosshairPos);
      var dims = instance.volumes.length ? instance.volumes[0].dimsRAS : null;
      var extent = dims && dims.length > 3 ? dims[axis + 1] : 100;
      var step = (event.deltaY > 0 ? 1 : -1) / Math.max(extent, 2);
      position[axis] = Math.min(Math.max(position[axis] + step, 0), 1);
      instance.scene.crosshairPos = position;
      instance.drawScene();
      if (instance.onLocationChange) {
        try { instance.onLocationChange({ mm: instance.frac2mm(position) }); } catch (ignored) {}
      }
      event.preventDefault();
      event.stopPropagation();
    }, { passive: false, capture: true });
  }

  function mainAxisFor(event) {
    if (state.mode === "surface") return null;
    var map = { axial: 2, coronal: 1, sagittal: 0 };
    if (map[state.view] !== undefined) return map[state.view];
    if (state.view === "render") return null;
    // Multiplanar: NiiVue lays the three planes out left to right, so the
    // horizontal position of the cursor says which one is being scrolled.
    var box = (event.currentTarget || event.target).getBoundingClientRect();
    var third = (event.clientX - box.left) / box.width;
    return third < 0.34 ? 2 : (third < 0.67 ? 1 : 0);
  }

  function wireSurfaceControls() {
    // The sliders move a target; the surface eases towards it on its own.
    el.morph.addEventListener("input", function () {
      setMorphTarget(el.morph.value / 100);
    });
    el.separation.addEventListener("input", function () {
      state.split = el.separation.value / 100;
      requestSurfaceFrame();
    });
    el.curvature.addEventListener("input", function () {
      state.curvature = el.curvature.value / 100;
      refreshCurvature();
    });
    el["outline-width"].addEventListener("input", function () {
      state.outlineWidth = Number(el["outline-width"].value);
      drawRegionTexture();
      viewDraw();
    });
  }

  function wireSurfaceSpace() {
    el["surface-spaces"].addEventListener("click", function (event) {
      var target = event.target.closest("button");
      if (!target || target.disabled) return;
      state.surfaceSpace = target.getAttribute("data-surface-space");
      setPressed(el["surface-spaces"], "data-surface-space", state.surfaceSpace);
      buildSurface();
    });
  }

  function wireRegions() {
    el["roi-filter"].addEventListener("input", renderRegionList);
    el["roi-opacity"].addEventListener("input", function () {
      if (state.mode === "surface") {
        state.outlineOpacity = el["roi-opacity"].value / 100;
        viewDraw();
        drawAnnotations(true);
        return;
      }
      refreshRegions();
    });
    el.modes.addEventListener("click", function (event) {
      var target = event.target.closest("button");
      if (!target || target.disabled) return;
      state.mode = target.getAttribute("data-mode-kind");
      applyMode();
    });
    el["roi-all"].addEventListener("click", function () {
      if (state.mode === "surface") {
        surfaceRegionNames().forEach(function (name) {
          if (!state.surfaceRegions[name]) {
            state.surfaceRegions[name] = true;
            colourSlot("surface:" + name);
          }
        });
        renderRegionList();
        paintSurfaceRegions();
        return;
      }
      var atlas = currentAtlas();
      if (!atlas) return;
      atlas.regions.forEach(function (region) {
        var key = regionKey(atlas.id, region.value);
        if (!state.regions[key]) { state.regions[key] = true; colourSlot(key); }
      });
      renderRegionList();
      refreshRegions();
    });
    el["roi-clear"].addEventListener("click", function () {
      Object.keys(state.surfaceRegions).forEach(function (name) {
        releaseColour("surface:" + name);
      });
      Object.keys(state.regions).forEach(releaseColour);
      state.surfaceRegions = {};
      state.regions = {};
      renderRegionList();
      // Clearing has to repaint the mode that is actually showing, or the
      // regions stay on screen until something else happens to redraw them.
      if (state.mode === "surface") paintSurfaceRegions(); else refreshRegions();
    });
    el.geometries.addEventListener("click", function (event) {
      var target = event.target.closest("button"); if (!target) return;
      state.geometry = target.getAttribute("data-geometry");
      var index = GEOMETRY_ORDER.indexOf(state.geometry);
      setPressed(el.geometries, "data-geometry", state.geometry);
      if (surfaceParts.length && index >= 0) setMorphTarget(index);
      else buildSurface();
    });
    el.hemispheres.addEventListener("click", function (event) {
      var target = event.target.closest("button"); if (!target) return;
      var hemisphere = target.getAttribute("data-hemi");
      state.hemispheres[hemisphere] = !state.hemispheres[hemisphere];
      target.setAttribute("aria-pressed", state.hemispheres[hemisphere] ? "true" : "false");
      if (state.mode === "surface") buildSurface();
    });
  }

  // Blink a layer off and back, which is how you check what is under it.
  function wireOpacityHotkeys() {
    var stash = {};
    function toggle(slider, name, after) {
      if (stash[name] === undefined) {
        stash[name] = slider.value;
        slider.value = 0;
      } else {
        slider.value = stash[name];
        delete stash[name];
      }
      after();
    }
    document.addEventListener("keydown", function (event) {
      var target = event.target || {};
      if (target.tagName === "INPUT" || target.tagName === "TEXTAREA") return;
      var key = (event.key || "").toLowerCase();
      if (key === "a") {
        toggle(el.opacity, "overlay", refreshStyle);
      } else if (key === "s") {
        toggle(el["roi-opacity"], "regions", refreshRegions);
      } else {
        return;
      }
      event.preventDefault();
    });
  }

  function wire() {
    el["threshold-input"].addEventListener("input", function () {
      retuneStep(el["threshold-input"]);
      refreshStyle();
    });
    el["window-max"].addEventListener("input", function () {
      retuneStep(el["window-max"]);
      refreshStyle();
    });
    el["window-reset"].addEventListener("click", resetWindow);
    el.opacity.addEventListener("input", refreshStyle);
    el["montage-slice"].addEventListener("input", applyMontageSlice);
    el["montage-prev"].addEventListener("click", function () { stepMontagePage(-1); });
    el["montage-next"].addEventListener("click", function () { stepMontagePage(1); });
    el.views.addEventListener("click", function (event) {
      var target = event.target.closest("button"); if (!target) return;
      state.view = target.getAttribute("data-view");
      setPressed(el.views, "data-view", state.view);
      applyView();
    });
    el["threshold-modes"].addEventListener("click", function (event) {
      var target = event.target.closest("button");
      if (!target || target.disabled) return;
      state.thresholdMode = target.getAttribute("data-mode");
      setPressed(el["threshold-modes"], "data-mode", state.thresholdMode);
      var defaults = { value: null, p: 0.001, q: 0.05 };
      if (defaults[state.thresholdMode] !== null) {
        el["threshold-input"].value = defaults[state.thresholdMode];
      } else {
        el["threshold-input"].value = Number((windowMax() * 0.2).toPrecision(3));
      }
      retuneStep(el["threshold-input"]);
      refreshStyle();
    });
    el.blends.addEventListener("click", function (event) {
      var target = event.target.closest("button"); if (!target) return;
      state.blend = target.getAttribute("data-blend");
      setPressed(el.blends, "data-blend", state.blend);
      refreshStyle();
    });
    el.spaces.addEventListener("click", function (event) {
      var target = event.target.closest("button");
      if (!target || target.disabled) return;
      state.space = target.getAttribute("data-space");
      setPressed(el.spaces, "data-space", state.space);
      renderBar();
      if (state.mode === "surface") { buildSurface(); return; }
      if (panelSpecs()) showPanels(panelSpecs()); else loadOverlay();
    });
  }

  // Everything the page shows about itself comes from the manifest, and so
  // does the feature set: a project with no surfaces never sees the surface
  // toggle, one with no atlas never sees the region panel. Data alone decides
  // it unless the manifest asks for something to be off.
  function describe(manifest) {
    var about = manifest.about || {};
    document.title = about.title || "Result Browser";
    el.title.textContent = about.title || "Result Browser";
    el.kicker.textContent = about.kicker || "";
    el.lede.textContent = about.lede || "";
    el.footnote.innerHTML = about.footnote || "";
  }

  function feature(name) {
    var features = state.manifest.features || {};
    if (features[name] === false) return false;
    if (name === "surface") {
      return !!(state.manifest.surfaces && Object.keys(state.manifest.surfaces).length);
    }
    if (name === "regions") {
      return !!(state.manifest.atlas && (state.manifest.atlas.atlases || []).length);
    }
    if (name === "subjectSpace") {
      return !!(state.manifest.subject_space && state.manifest.subject_space.templates);
    }
    return true;
  }

  function applyFeatures() {
    el["space-field"].hidden = !feature("subjectSpace");
    var regions = el["roi-list"].closest(".group");
    if (regions) regions.hidden = !feature("regions");
    el["roi-opacity-field"].hidden = !feature("regions") && !feature("surface");
    Array.prototype.forEach.call(el.views.children, function (node) {
      if (node.getAttribute("data-view") === "montage") {
        node.hidden = state.manifest.features &&
          state.manifest.features.montage === false;
      }
    });
    el.modes.hidden = !feature("surface");
  }

  function start(manifest) {
    state.manifest = manifest;
    describe(manifest);
    nv = new Niivue({
      backColor: [0.02, 0.03, 0.04, 1],
      crosshairColor: [0.31, 0.66, 0.85, 1],
      show3Dcrosshair: true,
      isNearestInterpolation: true,
      // NiiVue's wheel handler zooms as well as scrolling; gating it on focus
      // and never letting the canvas take focus leaves the page's own handler
      // in sole charge.
      scrollRequiresFocus: true,
      // dragMode governs the non-primary drag. Setting it to none disabled
      // middle-click pan as well, so it stays on pan and only the right
      // button is overridden, freeing that button for the zoom handler.
      dragMode: DRAG.pan,
      mouseEventConfig: { rightButton: DRAG.none, centerButton: DRAG.pan }
    });
    registerColormaps(nv);
    nv.attachTo("gl").then(function () {
      nv.onLocationChange = reportLocation;
      return loadImage(underlayFor(state.subject));
    }).then(function (anatomy) {
      anatomy.colormap = "gray";
      nv.addVolume(anatomy);
      loadedTemplate = manifest.template;
      nv.setSliceType(nv.sliceTypeMultiplanar);
      try { nv.setInterpolation(true); } catch (ignored) {}
      window.__viewer = {
        get nv() { return nv; },
        get state() { return state; },
        get montage() { return montageViews; },
        get parts() { return surfaceParts; },
        get overlayCanvas() { return view.overlayCanvas; },
        get surfaceView() { return view; },
        get marker() { return markerAt; },
        get labels() { return lastLabels; },
        renderMatrix: function () { return renderMatrix(); },
        refreshStyle: refreshStyle
      };
      wire();
      wireOpacityHotkeys();
      wireSurfaceSpace();
      wireSurfaceControls();
      wireSurfacePicking();
      wireSurfaceNavigation();
      watchAnnotations();
      wireRegions();
      wireDual();
      keepUnfocused(document.getElementById("gl"));
      wireZoom(nv, document.getElementById("gl"));
      wireWheel(nv, document.getElementById("gl"), mainAxisFor);
      registerRegionColormap(nv);
      renderRegionList();
      applyFeatures();
      selectReport(manifest.reports[0]);
    }).catch(function (error) {
      el.loading.textContent = "startup failed: " + error.message;
    });
  }

  fetch("manifest.json").then(function (r) { return r.json(); }).then(start)
    .catch(function (error) {
      el.loading.textContent = "could not read manifest.json — " + error.message;
    });
})();
</script>
</body>
</html>
