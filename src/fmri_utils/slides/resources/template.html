<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="deck-public-base" content="{{public_base}}">
<title>{{title}}</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<div id="deck">
<!--SLIDES-->
<section class="slide title-slide">
  <h1>{{title}}</h1>
  <p class="byline">{{byline}}</p>
</section>

<section class="slide">
  <h2>A slide</h2>
  <ul>
    <li data-step="1">Arrow keys or a clicker step through; F for full screen.</li>
    <li data-step="2">On the local copy, E edits: text, boxes, pictures, equations like <span class="math" data-tex="\Delta r = r_{\text{full}} - r_{\text{removed}}"></span>, and animations.</li>
  </ul>
</section>
<!--/SLIDES-->
</div>
<input id="counter" type="text" inputmode="decimal" spellcheck="false" autocomplete="off" title="slide.step: type a number (7 or 7.2) and press Enter to jump">
<div id="status" hidden></div>
<script src="vendor/katex/katex.min.js"></script>
<script src="charts.js"></script>
<script src="deck.js"></script>
<script src="editor.js"></script>
</body>
</html>
